<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nick Game - Gerador de Nicknames</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="conteudo">
        <div class="conteudo-titulo">
            <h2 class="titulo-principal">🎮 Nick Game: O Desafio Lendário</h2>
            <h3 class="titulo-secundario">Configure e tente gerar um Nickname de nível LENDÁRIO!</h3>
        </div>

        <!-- Painel do Jogo / Resultado -->
        <div class="conteudo-senha">
            <input name="senha" type="text" id="campo-senha" readonly placeholder="Clique em Gerar!">
            <button id="btn-gerar" class="botao-gerar">🎲 Gerar Nick</button>
        </div>

        <div class="parametro">
            <h3 class="parametro-titulo">Configurações do Nick</h3>
            <div class="parametro-coluna__senha">
                
                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">Tamanho do Nick</h4>
                    <div class="parametro-senha-botoes">
                       <button class="parametro-senha__botao" id="btn-menos">-</button>
                       <p class="parametro-senha__texto" id="tamanho-texto">12</p>
                       <button class="parametro-senha__botao" id="btn-mais">+</button>
                    </div>
                </div>

                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">Elementos do Nick</h4>
                    <div class="parametro-senha-checkbox">
                        <input id="maiusculo" type="checkbox" class="checkbox" checked>
                        <label for="maiusculo">Letras Maiúsculas</label>
                    </div>
                    <div class="parametro-senha-checkbox">
                        <input id="minusculo" type="checkbox" class="checkbox" checked>
                        <label for="minusculo">Letras Minúsculas</label>
                    </div>
                    <div class="parametro-senha-checkbox">
                        <input id="numero" type="checkbox" class="checkbox" checked>
                        <label for="numero">Estilo Leet (Números)</label>
                    </div>
                    <div class="parametro-senha-checkbox">
                        <input id="simbolo" type="checkbox" class="checkbox" checked>
                        <label for="simbolo">Símbolos de Clã</label>
                    </div>
                </div>

                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">Raridade do Nick</h4>
                    <div class="barra">
                        <div class="forca fraca"></div>
                    </div>
                    <div class="parametro-senha-textos">
                       <p>Comum</p>
                       <p>Raro</p>
                       <p>Lendário</p>
                    </div>
                    <p class="entropia">Aperte em Gerar para ver sua pontuação!</p>
                </div>

            </div>
        </div>
    </section>
    <script src="main.js"></script>
</body>
</html>
